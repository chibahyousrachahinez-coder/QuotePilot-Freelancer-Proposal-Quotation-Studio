<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="100%" height="100%" style="background-color: #FAF9F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <text x="40" y="35" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="2">PROPOSAL WIZARD ENGINE</text>
  <text x="40" y="65" font-size="22" font-weight="800" fill="#18181B">The 7-Stage Structured Quotation Workflow</text>

  <!-- Step cards row -->
  <!-- Step 1 -->
  <g transform="translate(40, 95)" filter="url(#cardShadow)">
    <rect width="115" height="240" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <circle cx="25" cy="28" r="12" fill="#EFF6FF"/>
    <text x="25" y="32" font-size="11" font-weight="800" fill="#2563EB" text-anchor="middle">1</text>
    <text x="45" y="32" font-size="11" font-weight="700" fill="#18181B">Client</text>
    <line x1="12" y1="50" x2="103" y2="50" stroke="#F4F4F5"/>
    <text x="12" y="70" font-size="9" fill="#52525B">
      <tspan x="12" dy="0">• Client Picker</tspan>
      <tspan x="12" dy="16">• Quick CRM add</tspan>
      <tspan x="12" dy="16">• Email &amp; phone</tspan>
      <tspan x="12" dy="16">• Company link</tspan>
    </text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(170, 95)" filter="url(#cardShadow)">
    <rect width="115" height="240" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <circle cx="25" cy="28" r="12" fill="#EFF6FF"/>
    <text x="25" y="32" font-size="11" font-weight="800" fill="#2563EB" text-anchor="middle">2</text>
    <text x="45" y="32" font-size="11" font-weight="700" fill="#18181B">Scope</text>
    <line x1="12" y1="50" x2="103" y2="50" stroke="#F4F4F5"/>
    <text x="12" y="70" font-size="9" fill="#52525B">
      <tspan x="12" dy="0">• Project Title</tspan>
      <tspan x="12" dy="16">• Overview text</tspan>
      <tspan x="12" dy="16">• Kickoff date</tspan>
      <tspan x="12" dy="16">• Delivery days</tspan>
      <tspan x="12" dy="16">• Pricing model</tspan>
    </text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(300, 95)" filter="url(#cardShadow)">
    <rect width="115" height="240" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <circle cx="25" cy="28" r="12" fill="#EFF6FF"/>
    <text x="25" y="32" font-size="11" font-weight="800" fill="#2563EB" text-anchor="middle">3</text>
    <text x="45" y="32" font-size="11" font-weight="700" fill="#18181B">Services</text>
    <line x1="12" y1="50" x2="103" y2="50" stroke="#F4F4F5"/>
    <text x="12" y="70" font-size="9" fill="#52525B">
      <tspan x="12" dy="0">• Line items</tspan>
      <tspan x="12" dy="16">• Descriptions</tspan>
      <tspan x="12" dy="16">• Quantity/unit</tspan>
      <tspan x="12" dy="16">• Rate per unit</tspan>
      <tspan x="12" dy="16">• Auto subtotal</tspan>
    </text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(430, 95)" filter="url(#cardShadow)">
    <rect width="115" height="240" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <circle cx="25" cy="28" r="12" fill="#EFF6FF"/>
    <text x="25" y="32" font-size="11" font-weight="800" fill="#2563EB" text-anchor="middle">4</text>
    <text x="45" y="32" font-size="11" font-weight="700" fill="#18181B">Pricing</text>
    <line x1="12" y1="50" x2="103" y2="50" stroke="#F4F4F5"/>
    <text x="12" y="70" font-size="9" fill="#52525B">
      <tspan x="12" dy="0">• Discounts % / $</tspan>
      <tspan x="12" dy="16">• Tax rate %</tspan>
      <tspan x="12" dy="16">• Currency code</tspan>
      <tspan x="12" dy="16">• Real-time sum</tspan>
      <tspan x="12" dy="16">• Total rounded</tspan>
    </text>
  </g>

  <!-- Step 5 -->
  <g transform="translate(560, 95)" filter="url(#cardShadow)">
    <rect width="115" height="240" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <circle cx="25" cy="28" r="12" fill="#EFF6FF"/>
    <text x="25" y="32" font-size="11" font-weight="800" fill="#2563EB" text-anchor="middle">5</text>
    <text x="45" y="32" font-size="11" font-weight="700" fill="#18181B">Terms</text>
    <line x1="12" y1="50" x2="103" y2="50" stroke="#F4F4F5"/>
    <text x="12" y="70" font-size="9" fill="#52525B">
      <tspan x="12" dy="0">• 50/50 Deposit</tspan>
      <tspan x="12" dy="16">• 30/70 Retainer</tspan>
      <tspan x="12" dy="16">• 33/33/34 Phase</tspan>
      <tspan x="12" dy="16">• 100% Upfront</tspan>
      <tspan x="12" dy="16">• Custom triggers</tspan>
    </text>
  </g>

  <!-- Step 6 -->
  <g transform="translate(690, 95)" filter="url(#cardShadow)">
    <rect width="115" height="240" rx="10" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
    <circle cx="25" cy="28" r="12" fill="#DCFCE7"/>
    <text x="25" y="32" font-size="11" font-weight="800" fill="#16A34A" text-anchor="middle">6</text>
    <text x="45" y="32" font-size="11" font-weight="700" fill="#18181B">Safeguards</text>
    <line x1="12" y1="50" x2="103" y2="50" stroke="#F4F4F5"/>
    <text x="12" y="70" font-size="9" fill="#52525B">
      <tspan x="12" dy="0">• What's Included</tspan>
      <tspan x="12" dy="16">• Not Included</tspan>
      <tspan x="12" dy="16">• Revision rules</tspan>
      <tspan x="12" dy="16">• Client duties</tspan>
      <tspan x="12" dy="16">• Zero creep</tspan>
    </text>
  </g>

  <!-- Step 7 -->
  <g transform="translate(820, 95)" filter="url(#cardShadow)">
    <rect width="120" height="240" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <circle cx="25" cy="28" r="12" fill="#2563EB"/>
    <text x="25" y="32" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">7</text>
    <text x="45" y="32" font-size="11" font-weight="700" fill="#FFFFFF">Generate</text>
    <line x1="12" y1="50" x2="108" y2="50" stroke="#27272A"/>
    <text x="12" y="70" font-size="9" fill="#D4D4D8">
      <tspan x="12" dy="0">• Full Preview</tspan>
      <tspan x="12" dy="16">• Save as Draft</tspan>
      <tspan x="12" dy="16">• Export to PDF</tspan>
      <tspan x="12" dy="16">• Copy Web Link</tspan>
      <tspan x="12" dy="16">• Digital Sign-off</tspan>
    </text>
  </g>

  <!-- Connecting Line across tops -->
  <line x1="90" y1="125" x2="880" y2="125" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2 3"/>
</svg>
