<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%" style="background-color: #FAF9F6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="50" y="45" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="2">QUOTE PILOT ARCHITECTURE</text>
  <text x="50" y="75" font-size="24" font-weight="800" fill="#18181B">End-to-End Freelancer Proposal Workflow</text>

  <!-- Step 1 -->
  <g transform="translate(50, 110)">
    <rect width="190" height="280" rx="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="190" height="6" rx="3" fill="#3B82F6"/>
    <circle cx="32" cy="40" r="16" fill="#EFF6FF"/>
    <text x="32" y="46" font-size="13" font-weight="800" fill="#2563EB" text-anchor="middle">1</text>
    <text x="58" y="45" font-size="14" font-weight="700" fill="#18181B">Client Inbound</text>
    <text x="20" y="85" font-size="12" fill="#52525B" font-weight="600">Initial Project Lead</text>
    <text x="20" y="110" font-size="11" fill="#71717A" width="150">
      <tspan x="20" dy="0">• Email, Slack or DM inquiry</tspan>
      <tspan x="20" dy="20">• Unstructured requirements</tspan>
      <tspan x="20" dy="20">• High risk of scope creep</tspan>
      <tspan x="20" dy="20">• Need for quick turnaround</tspan>
    </text>
    <rect x="20" y="210" width="150" height="42" rx="8" fill="#F4F4F5"/>
    <text x="95" y="236" font-size="11" font-weight="600" fill="#3F3F46" text-anchor="middle">Uncertain Scope</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 245 250 L 285 250" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
  <polygon points="285,245 295,250 285,255" fill="#2563EB"/>

  <!-- Step 2 -->
  <g transform="translate(295, 110)">
    <rect width="200" height="280" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
    <rect width="200" height="6" rx="3" fill="#2563EB"/>
    <circle cx="32" cy="40" r="16" fill="#2563EB"/>
    <text x="32" y="46" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="58" y="45" font-size="14" font-weight="700" fill="#18181B">QuotePilot Studio</text>
    <text x="20" y="85" font-size="12" fill="#2563EB" font-weight="700">7-Stage Structuring</text>
    <text x="20" y="110" font-size="11" fill="#52525B">
      <tspan x="20" dy="0">• 6 Pre-built templates</tspan>
      <tspan x="20" dy="20">• Itemized service pricing</tspan>
      <tspan x="20" dy="20">• 50/50 payment milestones</tspan>
      <tspan x="20" dy="20">• Clear What's Not Included</tspan>
      <tspan x="20" dy="20">• 2-round revision limits</tspan>
    </text>
    <rect x="20" y="210" width="160" height="42" rx="8" fill="#EFF6FF"/>
    <text x="100" y="236" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">&lt; 3 Min Generation</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 500 250 L 540 250" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
  <polygon points="540,245 550,250 540,255" fill="#2563EB"/>

  <!-- Step 3 -->
  <g transform="translate(550, 110)">
    <rect width="190" height="280" rx="14" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="190" height="6" rx="3" fill="#18181B"/>
    <circle cx="32" cy="40" r="16" fill="#F4F4F5"/>
    <text x="32" y="46" font-size="13" font-weight="800" fill="#18181B" text-anchor="middle">3</text>
    <text x="58" y="45" font-size="14" font-weight="700" fill="#18181B">Executive PDF</text>
    <text x="20" y="85" font-size="12" fill="#52525B" font-weight="600">Client Presentation</text>
    <text x="20" y="110" font-size="11" fill="#71717A">
      <tspan x="20" dy="0">• Monogram studio mark</tspan>
      <tspan x="20" dy="20">• Tabular financial sums</tspan>
      <tspan x="20" dy="20">• Clean print-ready styling</tspan>
      <tspan x="20" dy="20">• Digital proposal link</tspan>
    </text>
    <rect x="20" y="210" width="150" height="42" rx="8" fill="#18181B"/>
    <text x="95" y="236" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">High-Trust Aesthetic</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <path d="M 745 250 L 785 250" stroke="#86EFAC" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
  <polygon points="785,245 795,250 785,255" fill="#16A34A"/>

  <!-- Step 4 -->
  <g transform="translate(795, 110)">
    <rect width="160" height="280" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="160" height="6" rx="3" fill="#16A34A"/>
    <circle cx="32" cy="40" r="16" fill="#DCFCE7"/>
    <text x="32" y="46" font-size="13" font-weight="800" fill="#16A34A" text-anchor="middle">4</text>
    <text x="58" y="45" font-size="14" font-weight="700" fill="#18181B">Signed Deal</text>
    <text x="20" y="85" font-size="12" fill="#16A34A" font-weight="700">Formal Sign-Off</text>
    <text x="20" y="110" font-size="11" fill="#52525B">
      <tspan x="20" dy="0">• Digital name sign-off</tspan>
      <tspan x="20" dy="20">• 50% deposit locked</tspan>
      <tspan x="20" dy="20">• Kickoff date reserved</tspan>
      <tspan x="20" dy="20">• Zero scope ambiguity</tspan>
    </text>
    <rect x="20" y="210" width="120" height="42" rx="8" fill="#DCFCE7"/>
    <text x="80" y="236" font-size="11" font-weight="700" fill="#16A34A" text-anchor="middle">Deal Closed</text>
  </g>

  <!-- Footer notice -->
  <text x="50" y="445" font-size="11" fill="#71717A">100% Client-Side Local Storage • Zero Remote Tracking • Machine-Readable JSON Export &amp; Backup</text>
</svg>
